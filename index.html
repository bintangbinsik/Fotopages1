<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>File Arsip Issuda XII.4 By @binsik.exe</title>
    <style>
        :root {
            --background: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --folder-color: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--background); color: var(--text); padding: 12px; min-height: 100vh; }
        .container { width: 100%; max-width: 600px; margin: 0 auto; }
        
        header { text-align: center; padding: 15px 0; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
        header h1 { font-size: 20px; color: #818cf8; font-weight: 700; }
        header p { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
        
        .loading { text-align: center; padding: 30px; color: var(--text-muted); font-style: italic; font-size: 13px; }

        /* Struktur Folder Super Ringan */
        .folder-node { margin-left: 8px; margin-top: 8px; }
        
        .folder-header {
            background-color: var(--surface);
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            font-size: 13px;
        }
        
        .folder-header::before { content: "📁"; color: var(--folder-color); }
        .folder-node.open > .folder-header::before { content: "📂"; }
        
        .folder-content { display: none; padding-left: 8px; border-left: 1px dashed var(--border); margin-top: 4px; }
        .folder-node.open > .folder-content { display: block; }

        /* Grid Komponen File Minim Ukuran */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 Kolom di HP agar minim space */
            gap: 6px;
            margin-top: 8px;
            margin-bottom: 12px;
        }

        .file-card {
            background: #111827;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        /* Preview Kotak Kecil Mini */
        .img-container { width: 100%; aspect-ratio: 1/1; background: #000; position: relative; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }

        /* Indikator Video */
        .video-badge {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Komponen File Selain Gambar/Video */
        .non-img-container {
            width: 100%;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            font-size: 24px;
        }

        .file-info { padding: 4px; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>File Arsip Issuda xii.4</h1>
            <p>By @binsik.exe</p>
        </header>

        <div id="loader" class="loading">Memuat data folder... ☕(mengirim data dari 📍 ungaran)</div>
        <div id="treeContainer"></div>
    </div>

    <script>
        // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
        const scriptUrl = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnTarD_ZUOH7-J3elwqF7LRMu7U5R4_cSJV7NqZJQbsci32CXdzR_SctE1Pce6LUExk3Q4Z0e1HHHItxCFXWTe8kPnmCjSzWVf7b9t0onviXCovEw6Ve3pB7Y2CirXaLaqKo6WKyQ6P50EvCSX92qDYffmqdA4C4dy2OAPcyFT1H1UdClRLV0qtDsSWUoUqaidL3n7zMMyH1_kgMJ7LFdpZ9D2I1H9YVJ4yr50gMgFyOs0bJv-0VMklrOYvbxk3pVJO-NDSYiPwHjL7I6gLx0htJYhpT0A&lib=MrbdfUuDjhnYKq6NjtVxNcJANzck4hlvJ"; 

        async function init() {
            try {
                const response = await fetch(scriptUrl);
                const data = await response.json();
                document.getElementById('loader').style.display = 'none';
                document.getElementById('treeContainer').appendChild(buildTreeDOM(data));
            } catch (err) {
                document.getElementById('loader').innerText = "Gagal memuat data.";
                console.error(err);
            }
        }

        function buildTreeDOM(node) {
            const folderDiv = document.createElement('div');
            folderDiv.className = 'folder-node';
            
            const header = document.createElement('div');
            header.className = 'folder-header';
            header.innerText = node.name;
            header.onclick = (e) => {
                e.stopPropagation();
                folderDiv.classList.toggle('open');
            };
            folderDiv.appendChild(header);
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'folder-content';
            
            const fileGrid = document.createElement('div');
            fileGrid.className = 'file-grid';
            
            let hasFiles = false;

            node.children.forEach(child => {
                if (child.type === 'folder') {
                    contentDiv.appendChild(buildTreeDOM(child));
                } else {
                    hasFiles = true;
                    const fileCard = document.createElement('a');
                    fileCard.className = 'file-card';
                    
                    // SEMUA DI-AKSES MELALUI LINK PUBLIK DIRECT (Bukan tampilan web Google Drive bawaan)
                    // Menggunakan uc?export=view agar browser langsung membuka filenya mentah-mentah
                    fileCard.href = "https://docs.google.com/uc?export=view&id=" + child.id;
                    fileCard.target = '_blank';

                    if (child.type === 'image') {
                        // Kunci Kelancaran HP: Untuk preview halaman utama, kita batasi ukurannya hanya s150 (sangat ringan)
                        const previewUrl = "https://lh3.googleusercontent.com/d/1TgWJYjMPzqadGK-NE1h361yNOJGsZ2sM4" + child.id + "=s150";
                        fileCard.innerHTML = `
                            <div class="img-container">
                                <img src="${previewUrl}" alt="${child.name}" loading="lazy">
                            </div>
                            <div class="file-info">${child.name.split('.')[0]}</div>
                        `;
                    } else if (child.type === 'video') {
                        // Video diberikan thumbnail gambar statis ringan + lambang Play agar HP tidak lag meload video langsung
                        const videoThumbUrl = "https://lh3.googleusercontent.com/d/1TgWJYjMPzqadGK-NE1h361yNOJGsZ2sM4" + child.id + "=s150";
                        fileCard.innerHTML = `
                            <div class="img-container">
                                <img src="${videoThumbUrl}" alt="${child.name}" loading="lazy" onerror="this.src='https://placehold.co/150x150/1e293b/ffffff?text=VIDEO'">
                                <div class="video-badge">▶</div>
                            </div>
                            <div class="file-info">${child.name}</div>
                        `;
                    } else {
                        // File dokumen lainnya
                        let icon = "📄";
                        if (child.type === 'pdf') icon = "📕";
                        fileCard.innerHTML = `
                            <div class="non-img-container"><div>${icon}</div></div>
                            <div class="file-info">${child.name}</div>
                        `;
                    }
                    fileGrid.appendChild(fileCard);
                }
            });

            if (hasFiles) {
                contentDiv.insertBefore(fileGrid, contentDiv.firstChild);
            }
            
            folderDiv.appendChild(contentDiv);
            return folderDiv;
        }

        init();
    </script>
</body>
</html>
